name: Build Lilly APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Download offline wake-word model
        run: |
          curl -fsSL -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-in-0.4.zip
          unzip -q model.zip
          mkdir -p app/src/main/assets
          rm -rf app/src/main/assets/model-en-in
          mv vosk-model-small-en-in-0.4 app/src/main/assets/model-en-in
          echo "en-in-0.4" > app/src/main/assets/model-en-in/uuid
          du -sh app/src/main/assets/model-en-in

      - name: Offline voice engine (sherpa-onnx)
        run: |
          mkdir -p app/libs
          curl -fSL -o app/libs/sherpa-onnx.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar
          ls -lh app/libs

      - name: Offline voice pack (Hindi female, Priyamvada)
        run: |
          curl -fSL -o voice.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-hi_IN-priyamvada-medium.tar.bz2
          tar xf voice.tar.bz2
          cd vits-piper-hi_IN-priyamvada-medium
          ls -la
          zip -qr ../voice-hi-female.zip .
          cd ..
          ls -lh voice-hi-female.zip

      - name: QA tests (Lilly ki samajh)
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Lilly.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Lilly-apk
          path: Lilly.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.7-build${{ github.run_number }}
          name: Lilly v4.7 (build ${{ github.run_number }})
          body: "Download Lilly.apk on your phone and install it."
          files: |
            Lilly.apk
            voice-hi-female.zip
          make_latest: true
