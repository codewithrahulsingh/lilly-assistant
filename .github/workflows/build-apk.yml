name: Build Lilly APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Download offline wake-word model
        run: |
          curl -fsSL -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-in-0.4.zip
          unzip -q model.zip
          mkdir -p app/src/main/assets
          rm -rf app/src/main/assets/model-en-in
          mv vosk-model-small-en-in-0.4 app/src/main/assets/model-en-in
          echo "en-in-0.4" > app/src/main/assets/model-en-in/uuid
          du -sh app/src/main/assets/model-en-in

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Lilly.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Lilly-apk
          path: Lilly.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1-build${{ github.run_number }}
          name: Lilly v2.1 (build ${{ github.run_number }})
          body: "Phone par Lilly.apk download karke install karein."
          files: Lilly.apk
          make_latest: true
