name: Build Lilly APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Download offline wake-word model
        run: |
          curl -fsSL -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-in-0.4.zip
          unzip -q model.zip
          mkdir -p app/src/main/assets
          rm -rf app/src/main/assets/model-en-in
          mv vosk-model-small-en-in-0.4 app/src/main/assets/model-en-in
          echo "en-in-0.4" > app/src/main/assets/model-en-in/uuid
          du -sh app/src/main/assets/model-en-in

      - name: Offline voice engine (sherpa-onnx)
        run: |
          mkdir -p app/libs
          curl -fSL -o app/libs/sherpa-onnx.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar
          ls -lh app/libs

      - name: Voice packs (fixed "voices" release, uploaded once)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view voices >/dev/null 2>&1 || \
            gh release create voices --title "Lilly voice packs" --notes "Voice downloads used inside the Lilly app. Don't install these directly." --latest=false
          have=$(gh release view voices --json assets -q '.assets[].name')
          if ! echo "$have" | grep -qx voice-hi-female.zip; then
            curl -fSL -o voice.tar.bz2 \
              https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-hi_IN-priyamvada-medium.tar.bz2
            tar xf voice.tar.bz2
            (cd vits-piper-hi_IN-priyamvada-medium && zip -qr ../voice-hi-female.zip .)
            gh release upload voices voice-hi-female.zip --clobber
            rm -rf voice.tar.bz2 vits-piper-hi_IN-priyamvada-medium
          fi
          if ! echo "$have" | grep -qx voice-hi-male.zip; then
            curl -fSL -o voicem.tar.bz2 \
              https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-hi_IN-pratham-medium.tar.bz2
            tar xf voicem.tar.bz2
            (cd vits-piper-hi_IN-pratham-medium && zip -qr ../voice-hi-male.zip .)
            gh release upload voices voice-hi-male.zip --clobber
            rm -rf voicem.tar.bz2 vits-piper-hi_IN-pratham-medium
          fi
          if ! echo "$have" | grep -qx voice-match.onnx; then
            curl -fSL -o voice-match.onnx \
              https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/3dspeaker_speech_campplus_sv_zh_en_16k-common_advanced.onnx
            gh release upload voices voice-match.onnx --clobber
            rm -f voice-match.onnx
          fi
          if ! echo "$have" | grep -qx voice-kokoro.zip; then
            curl -fSL -o kokoro.tar.bz2 \
              https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-int8-multi-lang-v1_0.tar.bz2
            tar xf kokoro.tar.bz2
            d=kokoro-int8-multi-lang-v1_0
            ls -la $d
            (cd $d && zip -qr ../voice-kokoro.zip model.int8.onnx voices.bin tokens.txt espeak-ng-data)
            ls -lh voice-kokoro.zip
            gh release upload voices voice-kokoro.zip --clobber
            rm -rf kokoro.tar.bz2 $d
          fi
          gh release view voices --json assets -q '.assets[] | "\(.name) \(.size)"'

      - name: QA tests (Lilly ki samajh)
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Lilly.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Lilly-apk
          path: Lilly.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v6.4-build${{ github.run_number }}
          name: Lilly v6.4 (build ${{ github.run_number }})
          body: "Download Lilly.apk on your phone and install it."
          files: Lilly.apk
          make_latest: true
